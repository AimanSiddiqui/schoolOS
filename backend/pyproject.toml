[project]
name = "schoolos-backend"
version = "0.1.0"
description = "FastAPI backend for the SchoolOS MVP."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.142.2",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.1",
  "SQLAlchemy==2.1.3",
  "uvicorn[standard]==0.53.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
