name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_DB: schoolos_test
          POSTGRES_USER: schoolos
          POSTGRES_PASSWORD: schoolos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolos -d schoolos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: pytest tests/test_attendance.py tests/test_actions.py tests/test_communication.py
        env:
          SCHOOLOS_TEST_DATABASE_URL: postgresql+psycopg://schoolos:schoolos_test_password@localhost:5432/schoolos_test
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://schoolos:schoolos_test_password@localhost:5432/schoolos_test
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://schoolos:schoolos_test_password@localhost:5432/schoolos_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
